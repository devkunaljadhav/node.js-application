  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # 1. Download artifact
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: nodejs-app
          path: app

      # 2. Check artifact
      - name: Check artifact
        run: |
          echo "Downloaded application:"
          ls -la app

      # 3. Setup SSH
      - name: Setup SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh

          echo "$EC2_SSH_KEY" > ~/.ssh/ec2-key.pem

          chmod 600 ~/.ssh/ec2-key.pem

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      # 4. Create application directory
      - name: Prepare EC2
        run: |
          ssh -i ~/.ssh/ec2-key.pem \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -p ~/nodejs-app"

      # 5. Copy application
      - name: Copy application to EC2
        run: |
          scp -i ~/.ssh/ec2-key.pem \
            -r app/* \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/nodejs-app/

      # 6. Install dependencies and start application
      - name: Deploy Node.js application
        run: |
          ssh -i ~/.ssh/ec2-key.pem \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

            cd ~/nodejs-app

            echo "Installing production dependencies..."
            npm ci --omit=dev

            echo "Starting application with PM2..."

            pm2 delete nodejs-app || true

            pm2 start server.js --name nodejs-app

            pm2 save

            echo "Deployment completed."

            pm2 status

          EOF

      # 7. Health check
      - name: Health check
        run: |
          sleep 5

          curl -f http://${{ secrets.EC2_HOST }}:3000/health
