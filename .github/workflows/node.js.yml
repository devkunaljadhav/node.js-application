name: Node.js CI Pipeline

on:
  push:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Check versions
      - name: Check Node.js and npm
        run: |
          node --version
          npm --version

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Run tests
      - name: Run tests
        run: npm test

      # 6. Build application
      - name: Build application
        run: npm run build --if-present

      # 7. Upload artifact
      - name: Upload Node.js artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-app
          path: |
            .
            !node_modules
            !.git
